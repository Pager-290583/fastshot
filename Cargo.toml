[package]
name = "fastshot"
version = "0.1.0"
edition = "2024"
description = "Powerful yet simple to use screenshot software (Rust re-implementation inspired by Flameshot)"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.36"
egui-phosphor = "0.14"
epaint_default_fonts = "0.36"
tiny-skia = "0.12"
ab_glyph = "0.2"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screenshot", "open_uri"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
chrono = "0.4"
notify-rust = "4"
ksni = { version = "0.3", features = ["blocking"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
x11rb = { version = "0.13", features = ["randr"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
ureq = { version = "3", features = ["json"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
url = "2"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
