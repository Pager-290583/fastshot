id: io.github.Pager_290583.Fastshot
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: fastshot

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Imgur upload
  - --share=network
  # Default save folder, cleanup of the portal's temporary capture
  - --filesystem=xdg-pictures
  - --talk-name=org.freedesktop.Notifications
  # Tray icon (StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  # wl-copy: serves the clipboard after the capture window closes.
  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dzshcompletiondir=no
      - -Dfishcompletiondir=no
    cleanup:
      - /share/man
      - /share/bash-completion
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.2.1.tar.gz
        sha256: 6eb8081207fb5581d1d82c4bcd9587205a31a3d47bea3ebeb7f41aa1143783eb

  - name: fastshot
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/fastshot/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/fastshot /app/bin/fastshot
      - install -Dm644 assets/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 assets/${FLATPAK_ID}.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 assets/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .cargo
          - target
          - flatpak
          - .flatpak-builder
      - cargo-sources.json
